apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pihole  
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  strategy: {}
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
      - image: pihole/pihole
        name: pihole
        env:
        - name: TZ
          value: "Africa/Johannesburg"
        - name: WEBPASSWORD
          value: "password"
        ports:
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        - containerPort: 80
          name: web
          protocol: TCP
        volumeMounts:
        - name: pihole-etc-volume
          mountPath: /etc/pihole
        - name: pihole-dnsmasq-volume
          mountPath: /etc/dnsmasq.d
      volumes:
      - name: pihole-etc-volume
        persistentVolumeClaim:
          claimName: pihole-etc-pvc 
      - name: pihole-dnsmasq-volume
        persistentVolumeClaim:
          claimName: pihole-dnsmasq-pvc 
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  namespace: pihole
spec:
  type: LoadBalancer
  selector:
    app: pihole
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
    - name: web
      port: 8080
      protocol: TCP
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: pihole
spec:
  parentRefs:
    - name: homelab-gw
      namespace: cilium-gateway
  hostnames:
    - "pihole.my.network"
  rules:
    - backendRefs:
        - name: pihole-dns
          port: 8080
